<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>署名·快速 样张对照</title>
  <style>
    body { font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; margin: 24px; color: #222; background: #f4f4f5; }
    h1 { font-size: 22px; margin: 0 0 8px; }
    h2 { font-size: 18px; margin: 28px 0 8px; }
    p { line-height: 1.6; max-width: 880px; color: #444; }
    figure { margin: 16px 0 28px; background: #fff; padding: 12px; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
    img { display: block; max-width: 100%; height: auto; }
    figcaption { margin-top: 8px; font-size: 14px; color: #555; }
    .row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
    @media (max-width: 900px) { .row { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <h1>署名·快速 · 样张对照</h1>
  <p>请对照后回复要用哪一档。建议：纹理图走狗图位移；平涂走最右「可见度 8 / 署名 0」。</p>

  <h2>1. 狗图 · 位移（纹理图建议走这一路）</h2>
  <figure>
    <img src="dog_disp_credit.png" alt="狗图位移署名" />
    <figcaption>整词位移，字号短边 15%，位移 10px，带阴影。</figcaption>
  </figure>

  <h2>2. 猫图 · 三档浅字放大（蓝底最容易看出深浅）</h2>
  <figure>
    <img src="cat_faint_zoom.png" alt="猫图三档放大" />
    <figcaption>左：现在配方（可见度 18 + 署名 50）。中：10 / 8。右：8 / 0（建议）。</figcaption>
  </figure>

  <h2>3. 猫图全图</h2>
  <div class="row">
    <figure>
      <img src="cat_now_v18_s50.png" alt="现在 18/50" />
      <figcaption>现在：18 / 署名 50</figcaption>
    </figure>
    <figure>
      <img src="cat_v10_s8.png" alt="10/8" />
      <figcaption>候选：10 / 署名 8</figcaption>
    </figure>
    <figure>
      <img src="cat_v8_s0.png" alt="8/0" />
      <figcaption>建议：8 / 署名 0</figcaption>
    </figure>
  </div>
</body>
</html>
